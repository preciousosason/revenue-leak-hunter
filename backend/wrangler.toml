name = "revenue-leak-hunter-api"
main = "src/index.js"
compatibility_date = "2026-09-21"

[[d1_databases]]
binding = "DB"
database_name = "revenue-leak-hunter"
database_id = "1e30dfac-7a33-43ac-add8-a187ee3560b6"
[[r2_buckets]]
binding = "FILES"
bucket_name = "revenue-leak-hunter-files"

# Raw session retention; lead records remain with attribution detached.
[vars]
ANALYTICS_RETENTION_DAYS = "180"
ANALYTICS_ALLOWED_ORIGINS = "https://revenue-leak-hunter.pages.dev,https://leakendia.com,https://www.leakendia.com"
OUTREACH_SENDER_EMAIL = "precious@leakendia.com"
GOOGLE_OAUTH_REDIRECT_URI = "https://revenue-leak-hunter-api.preciousosason.workers.dev/api/admin/outreach/google/callback"

[triggers]
crons = ["17 3 * * *"]
