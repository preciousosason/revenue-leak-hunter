<section class="testimonials section" id="testimonials">

    <div class="container">

        <div class="section-header testimonials-header">

            <span class="section-label">
                Client Proof
            </span>

            <h2 class="section-title">
                The Work Speaks.
                <br>
                The Clients Confirm It.
            </h2>

            <p class="section-description">
                Real feedback from people who trusted the process,
                found the leaks, and saw what changed after.
            </p>

        </div>


        <div
            class="testimonials-stage"
            id="testimonials-stage"
            aria-live="polite"
        >

            <div class="testimonials-loading">
                Loading client feedback...
            </div>

        </div>


        <div class="testimonials-controls">

            <button
                type="button"
                class="testimonial-control"
                id="testimonial-prev"
                aria-label="Previous review"
            >
                ←
            </button>


            <div
                class="testimonial-progress"
                id="testimonial-progress"
                aria-label="Review navigation"
            ></div>


            <button
                type="button"
                class="testimonial-control"
                id="testimonial-next"
                aria-label="Next review"
            >
                →
            </button>

        </div>


        <div class="testimonial-note">

            <span
                class="testimonial-note-marker"
                aria-hidden="true"
            >
                /
            </span>

            <div class="testimonial-note-content">

                <strong>
                    No manufactured praise.
                </strong>

                <p>
                    Reviews are submitted by clients.
                </p>

            </div>

        </div>


        <div class="testimonials-cta">

            <span class="testimonials-cta-label">
                Worked with me?
            </span>

            <a
                href="/pages/reviews/reviews.html"
                class="testimonials-cta-link"
            >
                Leave Your Review
                <span aria-hidden="true">→</span>
            </a>

        </div>

    </div>

</section>
